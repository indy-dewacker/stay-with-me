name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build mod
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: chain-of-fun-jar
          path: build/libs/*.jar

      # Every push to master refreshes a "latest" release with a direct .jar download.
      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Chain of Fun (latest build)
          prerelease: true
          make_latest: true
          files: build/libs/*.jar
          body: |
            Latest build of Chain of Fun for NeoForge 1.21.1, from commit ${{ github.sha }}.
            Put the .jar in the mods folder of every player's instance AND the server.
